# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/cashflow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mockaroo API 설정
mockaroo.api.url=https://api.mockaroo.com/api/generate.json
mockaroo.api.key=${MOCKAROO_API_KEY}